[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kernelridge"
version = "0.1.0"
description = "Evidence-aware infrastructure compatibility preflight"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
kernelridge = "kernelridge.cli:main"
vcm = "kernelridge.cli:main"

[tool.setuptools.packages.find]
include = ["kernelridge*"]
