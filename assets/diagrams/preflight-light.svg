<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" role="img" aria-labelledby="t d">
<title id="t">Kernelridge preflight</title>
<desc id="d">A RISC-V board whose chip exposes imafdc on lp64d with glibc 2.38. The release requires the vector extension v, so preflight fails the isa_extensions rule and the overall decision is FAIL, exit 1.</desc>
<style>
text { font-family: "Inter", "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1d2733; }
.mono { font-family: "JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace; }
.soft { fill: #6b7785; }
.acc { fill: #1f8a7a; }
.f { stroke: #1d2733; stroke-width: 1.3; stroke-linejoin: round; }
.t { fill: #ffffff; } .l { fill: #eef2f5; } .r { fill: #dde4ea; }
.wire { stroke: #1d2733; stroke-width: 1.3; fill: none; stroke-linecap: round; }
.thin { stroke: #1d2733; stroke-width: .9; fill: none; }
.hid { stroke: #6b7785; stroke-width: .9; stroke-dasharray: 3 4; fill: none; }
.rule { stroke: #b8c1cb; stroke-width: 1; stroke-dasharray: 2 4; }

.lead { fill: none; stroke: #1f8a7a; stroke-width: 1.4;
         stroke-dasharray: 1; stroke-dashoffset: 1;
         animation: draw .9s cubic-bezier(.6,0,.2,1) forwards; }
.in   { opacity: 0; animation: in .6s ease-out forwards; }
.row  { opacity: 0; animation: row .7s cubic-bezier(.2,.7,.2,1) forwards; }
.chip { opacity: 0; transform-box: fill-box; transform-origin: center;
         animation: stamp .45s cubic-bezier(.3,1.6,.5,1) forwards; }
.hot  { transform-box: fill-box; transform-origin: center;
         animation: hot 2.6s ease-out infinite; }
.cursor { animation: blink 1s steps(1) infinite; }
.sweep { animation: sweep 7s ease-in-out 4.5s infinite; opacity: 0; }

@keyframes draw  { to { stroke-dashoffset: 0; } }
@keyframes in    { to { opacity: 1; } }
@keyframes row   { from { opacity: 0; transform: translateX(14px); } to { opacity: 1; transform: none; } }
@keyframes stamp { from { opacity: 0; transform: scale(1.7); } to { opacity: 1; transform: scale(1); } }
@keyframes hot   { 0% { transform: scale(1); opacity: .7; } 70%,100% { transform: scale(2.6); opacity: 0; } }
@keyframes blink { 50% { opacity: 0; } }
@keyframes sweep { 0% { opacity: 0; transform: translateY(0); } 8% { opacity: 1; }
                    55% { opacity: 1; transform: translateY(280px); } 62%,100% { opacity: 0; transform: translateY(280px); } }
@media (prefers-reduced-motion: reduce) {
  * { animation-duration: 1ms !important; animation-delay: 0s !important;
       animation-iteration-count: 1 !important; }
}

.trace { fill: none; stroke: #6b7785; stroke-width: .9; stroke-dasharray: 5 4; animation: flow 1.6s linear infinite; }
@keyframes flow { to { stroke-dashoffset: -18; } }
.die { opacity: 0; animation: die 4s ease-in-out 2.5s infinite; }
@keyframes die { 0%,100% { opacity: 0; } 45%,55% { opacity: .22; } }
.vslot { fill: #f4c9c2; stroke: #c2463b; stroke-width: 1.5; stroke-dasharray: 4 3; animation: vs 1.6s steps(1) 2.5s infinite; }
.vmark { fill: #c2463b; animation: vs 1.6s steps(1) 2.5s infinite; }
@keyframes vs { 50% { opacity: .25; } }
</style>

