<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 640" width="1024" height="640" role="img" aria-labelledby="t d">
<title id="t">Kernelridge verdicts</title>
<desc id="d">A release artifact inside a wireframe inspection frame with a scan plane. Four outcomes: PASS only from a runtime check, REVIEW for a static match, UNKNOWN for missing inventory, FAIL for a named mismatch.</desc>
<style>
text { font-family: "Inter", "Helvetica Neue", Helvetica, Arial, sans-serif;
        fill: #2c2c2a; font-size: 21px; letter-spacing: .1px; }
.mono { font-family: "JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace;
         font-size: 15px; fill: #8f8c82; }
.solid { stroke: #2c2c2a; stroke-width: 1.4; stroke-linejoin: round; }
.top { fill: #fdfcf8; } .left { fill: #f2efe6; } .right { fill: #e8e4d8; }
.wire { fill: none; stroke: #2c2c2a; stroke-width: 1.3; stroke-linejoin: round; }
.thin { fill: none; stroke: #2c2c2a; stroke-width: .9; }
.hidden { stroke: #8f8c82; stroke-width: .8; stroke-dasharray: 3 4; }
.cons { stroke: #8f8c82; stroke-width: .9; fill: none; }
.dash { stroke: #8f8c82; stroke-width: .8; stroke-dasharray: 2 5; fill: none; }
.node { fill: #9aae8c; }
.ring { fill: #f8f6ef; stroke: #2c2c2a; stroke-width: 1.3; }

.lead { fill: none; stroke: #2c2c2a; stroke-width: 1.2;
         stroke-dasharray: 1; stroke-dashoffset: 1;
         animation: draw 1.1s cubic-bezier(.6,0,.2,1) forwards; }
.fade { opacity: 0; animation: fade .7s ease-out forwards; }
.rise { opacity: 0; animation: rise .8s ease-out forwards; }
.obj  { opacity: 0; animation: fade 1s ease-out .1s forwards; }
.float { animation: float 6s ease-in-out 1.2s infinite; }
.pulse { transform-box: fill-box; transform-origin: center;
          animation: pulse 3.2s ease-in-out infinite; }

@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes fade { to { opacity: 1; } }
@keyframes rise { from { opacity: 0; transform: translateY(6px); }
                   to { opacity: 1; transform: none; } }
@keyframes float { 0%,100% { transform: translateY(0); }
                    50% { transform: translateY(-5px); } }
@keyframes pulse { 0%,100% { transform: scale(1); opacity: .85; }
                    50% { transform: scale(1.6); opacity: .35; } }
@media (prefers-reduced-motion: reduce) {
  * { animation-duration: 1ms !important; animation-iteration-count: 1 !important;
       animation-delay: 0s !important; }
}

.scan { animation: scan 4.8s ease-in-out 1.6s infinite; }
@keyframes scan { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-150px); } }
.swatch { transform-box: fill-box; transform-origin: center; animation: tick 6s ease-in-out infinite; }
@keyframes tick { 0%,20%,100% { transform: scale(1); } 8% { transform: scale(1.45); } }
</style>

<defs>
  <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse">
    <circle cx="16" cy="16" r="1" fill="#d6d1c1"/>
  </pattern>
  <pattern id="grid" width="128" height="128" patternUnits="userSpaceOnUse" x="0" y="10">
    <path d="M128 0H0V128" fill="none" stroke="#e7e3d7" stroke-width="1"/>
  </pattern>
</defs>
<rect width="1024" height="640" fill="#f8f6ef"/>
<rect width="1024" height="640" fill="url(#dots)"/>
<rect width="1024" height="640" fill="url(#grid)"/>

<g class="fade" style="animation-delay:.05s"><line class="cons" x1="10" y1="330" x2="286" y2="330"/><line class="cons" x1="738" y1="330" x2="1014" y2="330"/><path class="cons" d="M276 325 L286 330 L276 335"/><path class="cons" d="M748 325 L738 330 L748 335"/><line class="cons" x1="300" y1="196" x2="724" y2="196"/><line class="cons" x1="300" y1="470" x2="724" y2="470"/><line class="cons" x1="200" y1="256" x2="200" y2="530"/><line class="cons" x1="824" y1="196" x2="824" y2="470"/><line class="cons" x1="396" y1="196" x2="396" y2="256"/><line class="cons" x1="628" y1="410" x2="628" y2="470"/><circle class="node pulse" cx="10" cy="330" r="4.5" style="animation-delay:1.40s"/><circle class="node pulse" cx="1014" cy="330" r="4.5" style="animation-delay:1.95s"/><circle class="node pulse" cx="200" cy="330" r="4.5" style="animation-delay:2.50s"/><circle class="node pulse" cx="824" cy="330" r="4.5" style="animation-delay:3.05s"/><circle class="node pulse" cx="300" cy="196" r="4.5" style="animation-delay:3.60s"/><circle class="node pulse" cx="396" cy="196" r="4.5" style="animation-delay:1.40s"/><circle class="node pulse" cx="724" cy="196" r="4.5" style="animation-delay:1.95s"/><circle class="node pulse" cx="824" cy="196" r="4.5" style="animation-delay:2.50s"/><circle class="node pulse" cx="300" cy="470" r="4.5" style="animation-delay:3.05s"/><circle class="node pulse" cx="628" cy="470" r="4.5" style="animation-delay:3.60s"/><circle class="node pulse" cx="724" cy="470" r="4.5" style="animation-delay:1.40s"/><circle class="node pulse" cx="200" cy="470" r="4.5" style="animation-delay:1.95s"/><circle class="node pulse" cx="200" cy="530" r="4.5" style="animation-delay:2.50s"/><circle cx="492" cy="196" r="2.4" fill="#2c2c2a"/></g>
<g class="obj"><g class="float">
<line class="hidden" x1="512.0" y1="365.0" x2="641.9" y2="440.0"/>
<line class="hidden" x1="512.0" y1="365.0" x2="382.1" y2="440.0"/>
<line class="hidden" x1="512.0" y1="365.0" x2="512.0" y2="215.0"/>
<polygon class="solid top" points="512.0,347.0 564.0,377.0 512.0,407.0 460.0,377.0"/>
<polygon class="solid left" points="460.0,440.0 512.0,470.0 512.0,407.0 460.0,377.0"/>
<polygon class="solid right" points="564.0,440.0 512.0,470.0 512.0,407.0 564.0,377.0"/>
<g transform="matrix(12.990,7.500,0,-15.000,460.0,440.0)"><path d="M0 3.2 H4 M2 4.2 V3.2" fill="none" stroke="#2c2c2a" stroke-width="1" vector-effect="non-scaling-stroke"/></g>
<g transform="matrix(12.990,7.500,-12.990,7.500,512.0,347.0)"><path d="M2 0 V4" fill="none" stroke="#2c2c2a" stroke-width="1" vector-effect="non-scaling-stroke"/></g>
<g class="scan"><polygon points="512.0,365.0 641.9,440.0 512.0,515.0 382.1,440.0" fill="#9aae8c" fill-opacity=".22" stroke="#9aae8c" stroke-width="1.6"/></g>
<line class="wire" x1="641.9" y1="440.0" x2="512.0" y2="515.0"/>
<line class="wire" x1="382.1" y1="440.0" x2="512.0" y2="515.0"/>
<line class="wire" x1="641.9" y1="440.0" x2="641.9" y2="290.0"/>
<line class="wire" x1="382.1" y1="440.0" x2="382.1" y2="290.0"/>
<line class="wire" x1="512.0" y1="515.0" x2="512.0" y2="365.0"/>
<line class="wire" x1="512.0" y1="215.0" x2="641.9" y2="290.0"/>
<line class="wire" x1="512.0" y1="215.0" x2="382.1" y2="290.0"/>
<line class="wire" x1="641.9" y1="290.0" x2="512.0" y2="365.0"/>
<line class="wire" x1="382.1" y1="290.0" x2="512.0" y2="365.0"/>
<rect x="508.0" y="361.0" width="8" height="8" fill="#f8f6ef" stroke="#2c2c2a" stroke-width="1.1"/>
<rect x="378.1" y="286.0" width="8" height="8" fill="#f8f6ef" stroke="#2c2c2a" stroke-width="1.1"/>
<rect x="637.9" y="286.0" width="8" height="8" fill="#f8f6ef" stroke="#2c2c2a" stroke-width="1.1"/>
<rect x="508.0" y="511.0" width="8" height="8" fill="#f8f6ef" stroke="#2c2c2a" stroke-width="1.1"/>
</g></g>

<g>
  <path class="lead" pathLength="1" style="animation-delay:0.50s"
        d="M392 250 L156.4 102.0"/>
  <circle class="node" cx="271.0" cy="174.0" r="4.5"/>
  <g class="fade" style="animation-delay:1.40s">
    <path class="thin" d="M167.2 104.0 L156.4 102.0 L162.8 110.9"/>
    <circle class="ring" cx="150" cy="98" r="7.5"/>
  </g>
  <g class="rise" style="animation-delay:1.50s">
    <rect x="58" y="36" width="12" height="12" rx="2" fill="#9aae8c" class="swatch" style="animation-delay:3.0s"/><text text-anchor="start"><tspan x="80" y="51">PASS</tspan><tspan x="80" y="76">runtime check only</tspan></text>
  </g>
  <circle r="3" fill="#9aae8c" opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.85;1"
             dur="3.6s" begin="2.5s" repeatCount="indefinite"/>
    <animateMotion dur="3.6s" begin="2.5s" repeatCount="indefinite"
                   path="M150 98 L392 250" keyPoints="0;1;1" keyTimes="0;.7;1"
                   calcMode="linear"/>
  </circle>
</g>
<g>
  <path class="lead" pathLength="1" style="animation-delay:0.80s"
        d="M632 250 L867.6 102.0"/>
  <circle class="node" cx="753.0" cy="174.0" r="4.5"/>
  <g class="fade" style="animation-delay:1.70s">
    <path class="thin" d="M861.2 110.9 L867.6 102.0 L856.8 104.0"/>
    <circle class="ring" cx="874" cy="98" r="7.5"/>
  </g>
  <g class="rise" style="animation-delay:1.80s">
    <rect x="954" y="36" width="12" height="12" rx="2" fill="#d9a441" class="swatch" style="animation-delay:4.5s"/><text text-anchor="end"><tspan x="944" y="51">REVIEW</tspan><tspan x="944" y="76">static match</tspan></text>
  </g>
  <circle r="3" fill="#9aae8c" opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.85;1"
             dur="3.6s" begin="2.8s" repeatCount="indefinite"/>
    <animateMotion dur="3.6s" begin="2.8s" repeatCount="indefinite"
                   path="M874 98 L632 250" keyPoints="0;1;1" keyTimes="0;.7;1"
                   calcMode="linear"/>
  </circle>
</g>
<g>
  <path class="lead" pathLength="1" style="animation-delay:1.10s"
        d="M392 418 L156.6 544.5"/>
  <circle class="node" cx="271.0" cy="483.0" r="4.5"/>
  <g class="fade" style="animation-delay:2.00s">
    <path class="thin" d="M163.7 536.0 L156.6 544.5 L167.5 543.2"/>
    <circle class="ring" cx="150" cy="548" r="7.5"/>
  </g>
  <g class="rise" style="animation-delay:2.10s">
    <rect x="58" y="571" width="12" height="12" rx="2" fill="#a9a69c" class="swatch" style="animation-delay:6.0s"/><text text-anchor="start"><tspan x="80" y="586">UNKNOWN</tspan><tspan x="80" y="611">not in inventory</tspan></text>
  </g>
  <circle r="3" fill="#9aae8c" opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.85;1"
             dur="3.6s" begin="3.1s" repeatCount="indefinite"/>
    <animateMotion dur="3.6s" begin="3.1s" repeatCount="indefinite"
                   path="M150 548 L392 418" keyPoints="0;1;1" keyTimes="0;.7;1"
                   calcMode="linear"/>
  </circle>
</g>
<g>
  <path class="lead" pathLength="1" style="animation-delay:1.40s"
        d="M632 418 L867.4 544.5"/>
  <circle class="node" cx="753.0" cy="483.0" r="4.5"/>
  <g class="fade" style="animation-delay:2.30s">
    <path class="thin" d="M856.5 543.2 L867.4 544.5 L860.3 536.0"/>
    <circle class="ring" cx="874" cy="548" r="7.5"/>
  </g>
  <g class="rise" style="animation-delay:2.40s">
    <rect x="954" y="571" width="12" height="12" rx="2" fill="#c4675a" class="swatch" style="animation-delay:7.5s"/><text text-anchor="end"><tspan x="944" y="586">FAIL</tspan><tspan x="944" y="611">mismatch named</tspan></text>
  </g>
  <circle r="3" fill="#9aae8c" opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.85;1"
             dur="3.6s" begin="3.4s" repeatCount="indefinite"/>
    <animateMotion dur="3.6s" begin="3.4s" repeatCount="indefinite"
                   path="M874 548 L632 418" keyPoints="0;1;1" keyTimes="0;.7;1"
                   calcMode="linear"/>
  </circle>
</g>
<text class="mono fade" style="animation-delay:.4s" x="512" y="38" text-anchor="middle">no optimistic PASS</text>
</svg>
