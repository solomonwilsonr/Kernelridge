<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" role="img" aria-labelledby="t d">
<title id="t">Kernelridge experiment plan</title>
<desc id="d">A seven-minute budget track. The mandatory 2-minute smoke test is reserved first, the 5-minute vector diagnosis fills the rest, and the 20-minute physical-board run is left out. Status PROPOSED, approval required.</desc>
<style>
text { font-family: "Inter", "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #d9e2ea; }
.mono { font-family: "JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace; }
.soft { fill: #8e9cab; }
.acc { fill: #4cc2ad; }
.f { stroke: #d9e2ea; stroke-width: 1.3; stroke-linejoin: round; }
.t { fill: #1c2834; } .l { fill: #17212c; } .r { fill: #121b24; }
.wire { stroke: #d9e2ea; stroke-width: 1.3; fill: none; stroke-linecap: round; }
.thin { stroke: #d9e2ea; stroke-width: .9; fill: none; }
.hid { stroke: #8e9cab; stroke-width: .9; stroke-dasharray: 3 4; fill: none; }
.rule { stroke: #3c4b5a; stroke-width: 1; stroke-dasharray: 2 4; }

.lead { fill: none; stroke: #4cc2ad; stroke-width: 1.4;
         stroke-dasharray: 1; stroke-dashoffset: 1;
         animation: draw .9s cubic-bezier(.6,0,.2,1) forwards; }
.in   { opacity: 0; animation: in .6s ease-out forwards; }
.row  { opacity: 0; animation: row .7s cubic-bezier(.2,.7,.2,1) forwards; }
.chip { opacity: 0; transform-box: fill-box; transform-origin: center;
         animation: stamp .45s cubic-bezier(.3,1.6,.5,1) forwards; }
.hot  { transform-box: fill-box; transform-origin: center;
         animation: hot 2.6s ease-out infinite; }
.cursor { animation: blink 1s steps(1) infinite; }
.sweep { animation: sweep 7s ease-in-out 4.5s infinite; opacity: 0; }

@keyframes draw  { to { stroke-dashoffset: 0; } }
@keyframes in    { to { opacity: 1; } }
@keyframes row   { from { opacity: 0; transform: translateX(14px); } to { opacity: 1; transform: none; } }
@keyframes stamp { from { opacity: 0; transform: scale(1.7); } to { opacity: 1; transform: scale(1); } }
@keyframes hot   { 0% { transform: scale(1); opacity: .7; } 70%,100% { transform: scale(2.6); opacity: 0; } }
@keyframes blink { 50% { opacity: 0; } }
@keyframes sweep { 0% { opacity: 0; transform: translateY(0); } 8% { opacity: 1; }
                    55% { opacity: 1; transform: translateY(280px); } 62%,100% { opacity: 0; transform: translateY(280px); } }
@media (prefers-reduced-motion: reduce) {
  * { animation-duration: 1ms !important; animation-delay: 0s !important;
       animation-iteration-count: 1 !important; }
}

.acc-f.t { fill: #4cc2ad; fill-opacity: .55; }
.acc-f.l, .acc-f.r { fill: #4cc2ad; fill-opacity: .35; }
.drop { opacity: 0; animation: drop .8s cubic-bezier(.3,1.4,.5,1) forwards; }
.b1 { animation-delay: 1.0s; } .b2 { animation-delay: 1.9s; }
@keyframes drop { from { opacity: 0; transform: translateY(-60px); } to { opacity: 1; transform: none; } }
.g { fill: none; stroke: #8e9cab; stroke-width: 1.2; stroke-dasharray: 5 4; }
.ghost { animation: hover 3s ease-in-out 2s infinite; }
@keyframes hover { 0%,100% { transform: translateX(0); opacity: .95; } 50% { transform: translateX(6px); opacity: .4; } }
</style>

